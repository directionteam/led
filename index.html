<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الأضواء - تحدي الذاكرة</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; font-family: sans-serif; color: white; user-select: none; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #main-container { display: flex; gap: 40px; z-index: 10; width: 95%; max-width: 1000px; align-items: center; justify-content: center; }
        
        /* شبكة الأضواء */
        #game-board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 400px; height: 400px; }
        .light {
            border-radius: 20px;
            cursor: none;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
            filter: brightness(0.3); /* مطفأ بالبداية */
            border: 4px solid #222;
        }
        
        /* ألوان الأضواء */
        #red { background-color: #ff3b30; }
        #blue { background-color: #007aff; }
        #green { background-color: #34c759; }
        #yellow { background-color: #ffcc00; }

        /* تأثير الإضاءة */
        .light.active {
            filter: brightness(1.5);
            transform: scale(1.05);
            box-shadow: 0 0 30px currentColor;
            border-color: #fff;
        }

        /* اللوحة الجانبية */
        #sidebar { display: flex; flex-direction: column; gap: 20px; width: 300px; }
        
        #camera-box { width: 100%; height: 220px; background: #000; border: 3px solid #444; border-radius: 15px; overflow: hidden; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        #data-panel { background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; border: 2px solid #444; text-align: center; }
        #status-text { font-size: 24px; font-weight: bold; color: #ffcc00; margin-bottom: 15px; height: 30px; }
        .score-box { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        
        #leaderboard { border-top: 1px solid #444; padding-top: 15px; margin-top: 15px; text-align: right; }
        #leaderboard h3 { margin: 0 0 10px 0; font-size: 16px; color: #34c759; text-align: center; }
        .score-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; background: #222; padding: 8px; border-radius: 5px; }

        /* المؤشر */
        #cursor { position: absolute; width: 40px; height: 40px; background-color: rgba(255, 255, 255, 0.2); border-radius: 50%; pointer-events: none; z-index: 100; transform: translate(-50%, -50%); border: 2px solid #fff; box-shadow: 0 0 15px #fff; display: none; }

        /* شاشات البداية والنهاية */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 50; }
        #overlay h1 { font-size: 40px; margin-bottom: 10px; color: #ffcc00; text-shadow: 0 0 20px #ffcc00; }
        #overlay p { font-size: 18px; color: #ccc; margin: 5px; text-align: center; }
        #player-name { padding: 12px; font-size: 18px; border-radius: 8px; border: none; margin-top: 20px; text-align: center; width: 250px; }
        #start-btn { margin-top: 20px; padding: 15px 40px; font-size: 20px; font-weight: bold; background-color: #ffcc00; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px #ffcc00; }
        #start-btn:hover { background-color: #ffdb4d; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="cursor"></div>

    <div id="main-container">
        <!-- لوحة الأضواء -->
        <div id="game-board">
            <div class="light" id="red" data-color="red"></div>
            <div class="light" id="blue" data-color="blue"></div>
            <div class="light" id="green" data-color="green"></div>
            <div class="light" id="yellow" data-color="yellow"></div>
        </div>

        <!-- اللوحة الجانبية -->
        <div id="sidebar">
            <div id="camera-box">
                <video id="video" autoplay playsinline muted></video>
            </div>

            <div id="data-panel">
                <div id="status-text">استعد...</div>
                <div class="score-box">المستوى الحالي: <span id="level-display">1</span></div>
                
                <div id="leaderboard">
                    <h3>🏆 أبطال الذاكرة</h3>
                    <div id="scores-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- شاشة البداية -->
    <div id="overlay">
        <h1>💡 لعبة الأضواء</h1>
        <p>راقب تسلسل إضاءة الألوان، ثم أعده بنفس الترتيب</p>
        <p>استخدم إصبعك للتحكم بالمؤشر</p>
        <input type="text" id="player-name" placeholder="اكتب اسمك هنا..." autocomplete="off">
        <button id="start-btn">ابدأ التحدي</button>
    </div>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('video');
        const cursor = document.getElementById('cursor');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const playerNameInput = document.getElementById('player-name');
        const statusText = document.getElementById('status-text');
        const levelDisplay = document.getElementById('level-display');
        
        const colors = ['red', 'blue', 'green', 'yellow'];
        const lights = {
            red: document.getElementById('red'),
            blue: document.getElementById('blue'),
            green: document.getElementById('green'),
            yellow: document.getElementById('yellow')
        };

        let handLandmarker = null;
        let sequence = [];
        let playerSequence = [];
        let level = 1;
        let isGameActive = false;
        let isPlayerTurn = false;
        let currentPlayer = "لاعب مجهول";
        let lastHoverTime = 0;
        let hoveredLight = null;

        // إدارة النتائج
        let highScores = JSON.parse(localStorage.getItem('lightsGameScores')) || [];
        function renderScores() {
            highScores.sort((a, b) => b.level - a.level); // الأعلى مستوى أولاً
            const container = document.getElementById('scores-container');
            container.innerHTML = '';
            highScores.slice(0, 3).forEach((score, index) => {
                container.innerHTML += `<div class="score-item"><span>${index+1}. ${score.name}</span> <span>مستوى ${score.level}</span></div>`;
            });
        }
        renderScores();

        // دالة النوم (لتأخير الأحداث)
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // تشغيل ضوء معين
        async function flashLight(color, duration = 500) {
            lights[color].classList.add('active');
            await sleep(duration);
            lights[color].classList.remove('active');
            await sleep(200);
        }

        // بدء الجولة التالية
        async function nextRound() {
            isPlayerTurn = false;
            playerSequence = [];
            levelDisplay.innerText = level;
            statusText.innerText = "راقب...";
            statusText.style.color = "#ffcc00";
            
            // إضافة لون جديد عشوائي
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sequence.push(randomColor);

            await sleep(1000);

            // عرض التسلسل
            for (let color of sequence) {
                await flashLight(color);
            }

            // دور اللاعب
            isPlayerTurn = true;
            statusText.innerText = "دورك الآن!";
            statusText.style.color = "#34c759";
        }

        // التحقق من اختيار اللاعب
        async function handlePlayerInput(color) {
            if (!isPlayerTurn || !isGameActive) return;

            // تأثير بصري
            lights[color].classList.add('active');
            setTimeout(() => lights[color].classList.remove('active'), 300);

            playerSequence.push(color);
            const currentIndex = playerSequence.length - 1;

            // إذا اختار لون غلط
            if (playerSequence[currentIndex] !== sequence[currentIndex]) {
                isGameActive = false;
                isPlayerTurn = false;
                statusText.innerText = "خطأ!";
                statusText.style.color = "#ff3b30";
                
                // حفظ النتيجة
                highScores.push({ name: currentPlayer, level: level - 1 });
                localStorage.setItem('lightsGameScores', JSON.stringify(highScores));
                renderScores();

                await sleep(1000);
                overlay.style.display = 'flex';
                overlay.innerHTML = `<h1 style="color:#ff3b30">انتهت اللعبة!</h1>
                                     <p>وصلت للمستوى ${level - 1}</p>
                                     <button id="start-btn" onclick="location.reload()">حاول مرة أخرى</button>`;
                return;
            }

            // إذا أكمل التسلسل بنجاح
            if (playerSequence.length === sequence.length) {
                isPlayerTurn = false;
                statusText.innerText = "ممتاز!";
                statusText.style.color = "#007aff";
                level++;
                await sleep(1500);
                nextRound();
            }
        }

        // إعداد الكاميرا والرؤية الحاسوبية
        async function initCV() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });

            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            await video.play();

            requestAnimationFrame(predictWebcam);
        }

        // تتبع اليد
        function predictWebcam() {
            if (video.readyState === 4) {
                const now = performance.now();
                const results = handLandmarker.detectForVideo(video, now);

                if (results.landmarks && results.landmarks.length > 0) {
                    const hand = results.landmarks[0];
                    const indexTip = hand[8]; 
                    
                    const x = (1 - indexTip.x) * window.innerWidth;
                    const y = indexTip.y * window.innerHeight;

                    cursor.style.display = 'block';
                    cursor.style.left = x + 'px';
                    cursor.style.top = y + 'px';

                    if (isPlayerTurn) {
                        checkHover(x, y, now);
                    }
                } else {
                    cursor.style.display = 'none';
                    hoveredLight = null;
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        // التحقق من التوقف فوق الضوء
        function checkHover(x, y, now) {
            const element = document.elementFromPoint(x, y);
            
            if (element && element.classList.contains('light')) {
                if (element !== hoveredLight) {
                    hoveredLight = element;
                    lastHoverTime = now; 
                } else if (now - lastHoverTime > 400) { // التوقف لـ 0.4 ثانية
                    handlePlayerInput(element.dataset.color);
                    lastHoverTime = now + 1000; // منع التكرار السريع
                }
            } else {
                hoveredLight = null;
            }
        }

        // بدء اللعبة
        startBtn.addEventListener('click', () => {
            currentPlayer = playerNameInput.value.trim() || "لاعب مجهول";
            overlay.style.display = 'none';
            isGameActive = true;
            level = 1;
            sequence = [];
            
            // إخفاء المؤشر الافتراضي للمتصفح
            document.body.style.cursor = 'none';
            
            initCV().catch(err => {
                alert("خطأ بالكاميرا: تأكد من إعطاء الإذن.");
            }).then(() => {
                nextRound();
            });
        });

    </script>
</body>
</html>
